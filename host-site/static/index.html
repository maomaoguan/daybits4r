<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Host Site - Embedding Console</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0b1220; color: #e2e8f0; }
      header { padding: 16px 24px; border-bottom: 1px solid #243044; display: flex; align-items: center; justify-content: space-between; }
      main { padding: 24px; }
      .container { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
      .panel { background: #0f172a; border: 1px solid #1f2a3a; border-radius: 10px; padding: 16px; }
      label { color: #a5b4fc; font-size: 12px; display: block; margin-bottom: 6px; }
      input[type="text"], select { width: 100%; background: #0b1220; color: #e2e8f0; border: 1px solid #1f2a3a; border-radius: 8px; padding: 10px; }
      iframe { width: 100%; height: 70vh; border: 1px solid #1f2a3a; border-radius: 10px; background: #111827; }
      .row { display: flex; gap: 8px; align-items: center; }
      button { background: #2563eb; border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
      a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <header>
      <div>Host Site</div>
      <nav>
        <a href="/">Home</a>
        <a href="/health" target="_blank">Health</a>
      </nav>
    </header>
    <main>
      <div class="container">
        <div class="panel">
          <div style="margin-bottom:12px;">
            <label>Console Origin</label>
            <input id="origin" type="text" value="http://localhost:8080">
          </div>
          <div style="margin-bottom:12px;">
            <label>Console Path</label>
            <select id="path">
              <option value="/dashboard.html">/dashboard.html</option>
              <option value="/users.html">/users.html</option>
              <option value="/index.html">/index.html</option>
            </select>
          </div>
          <div class="row">
            <button id="load">Load</button>
            <span id="status" style="color:#94a3b8;"></span>
          </div>
          <p style="margin-top:16px; color:#94a3b8;">This page is served from a different origin and embeds the console via an iframe. The console sets CSP frame-ancestors to allow this origin.</p>
        </div>
        <div class="panel">
          <iframe id="consoleFrame" src="about:blank" referrerpolicy="no-referrer"></iframe>
        </div>
      </div>
    </main>

    <script>
      function setFrame() {
        const origin = document.getElementById('origin').value.replace(/\/$/, '');
        const path = document.getElementById('path').value;
        const url = origin + path;
        document.getElementById('consoleFrame').src = url;
        document.getElementById('status').textContent = 'Loading ' + url + '...';
      }
      document.getElementById('load').addEventListener('click', setFrame);
      window.addEventListener('DOMContentLoaded', setFrame);
    </script>
  </body>
  </html>
