<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Header Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
:root {
  --bg: #0b0f17;
  --panel: #101726;
  --panel-2: #0e1422;
  --text: #e8eefc;
  --muted: #a6b0c3;
  --brand: #6da6ff;
  --brand-2: #9b8cff;
  --accent: #3bd9d9;
  --danger: #ff6b6b;
  --chip: #1a2236;
  --chip-active: #2a3452;
  --ring: 0 0 0 2px #ffffff20, 0 0 0 6px #6da6ff30;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
  background: radial-gradient(1200px 800px at 10% -10%, #1a2540 0%, transparent 60%),
              radial-gradient(700px 500px at 110% -20%, #1a2538 0%, transparent 60%),
              var(--bg);
  color: var(--text);
}

.search-header {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
  background: linear-gradient(180deg, #0d1322ee, #0b0f17ee),
              radial-gradient(800px 400px at 0% 0%, #14203a55 0%, transparent 70%);
  box-shadow: 0 0 0 1px #ffffff10, 0 8px 30px #00000055;
}

.search-header__row {
  display: grid;
  grid-template-columns: 180px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 20px;
}

.search-header__brand { display: inline-flex; align-items: center; gap: 10px; }
.brand__dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--accent)); box-shadow: 0 0 14px 4px #6da6ff60; }
.brand__name { font-weight: 700; letter-spacing: 0.2px; }

.search-header__bar { width: 100%; }

.search-input { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 8px; align-items: center; background: var(--panel); border-radius: 14px; padding: 10px 12px 10px 12px; border: 1px solid #ffffff12; box-shadow: inset 0 1px 0 #ffffff08, 0 10px 30px #00000033; }
.search-input:focus-within { box-shadow: var(--ring), inset 0 1px 0 #ffffff08, 0 10px 30px #00000033; }
.search-input__icon { width: 22px; height: 22px; fill: var(--muted); }
.search-input__field { background: transparent; border: 0; outline: 0; color: var(--text); font-size: 15px; padding: 8px 0; }
.search-input__field::placeholder { color: #9aa6bf; }
.search-input__clear { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 0; background: #ffffff06; color: var(--text); cursor: pointer; transition: transform .15s ease, background .15s ease; }
.search-input__clear svg { width: 18px; height: 18px; fill: var(--muted); }
.search-input__clear:hover { transform: scale(1.03); background: #ffffff12; }

.btn { position: relative; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; color: white; background: #ffffff12; transition: transform .16s ease, box-shadow .16s ease, background .16s ease; }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn--primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 20px #6da6ff30; }
.btn--primary:hover { box-shadow: 0 14px 30px #6da6ff45; }
.btn--ghost { background: #ffffff10; color: var(--text); }
.btn--ghost:hover { background: #ffffff18; }
.btn.is-bouncing { animation: btn-bounce .28s ease-out; }
@keyframes btn-bounce { 0% { transform: translateY(0); } 40% { transform: translateY(-2px); } 100% { transform: translateY(0); } }

.search-header__actions { display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 12px; background: #ffffff10; color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .15s ease, transform .15s ease; }
.icon-btn:hover { background: #ffffff18; }
.icon-btn svg { width: 20px; height: 20px; fill: var(--muted); }

.filters-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 0 20px 14px 20px; }
.filters-inline { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.filters-actions { display: inline-flex; gap: 10px; }

.select { display: grid; gap: 6px; color: var(--muted); }
.select__label { font-size: 12px; letter-spacing: 0.3px; }
.select select { appearance: none; -webkit-appearance: none; -moz-appearance: none; background: var(--panel-2); color: var(--text); border: 1px solid #ffffff16; border-radius: 10px; padding: 10px 32px 10px 12px; font-weight: 500; outline: none; transition: box-shadow .15s ease; }
.select select:focus { box-shadow: var(--ring); }

.chips { display: inline-flex; gap: 10px; flex-wrap: wrap; }
.chip { position: relative; overflow: hidden; border: 1px solid #ffffff10; background: var(--chip); color: var(--text); border-radius: 999px; padding: 8px 12px; cursor: pointer; transition: transform .16s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease; }
.chip:hover { transform: translateY(-1px); }
.chip[aria-pressed="true"], .chip.is-active { background: linear-gradient(180deg, var(--chip-active), #202a44); border-color: #6da6ff55; box-shadow: 0 0 0 1px #6da6ff55 inset, 0 8px 24px #6da6ff2e, 0 0 30px #6da6ff30; }
.chip__label { font-weight: 600; font-size: 13px; color: #e6edff; }

/* Ripple effect for chips */
.chip .ripple {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle at center, #9bb7ff80 0%, #6da6ff40 45%, transparent 60%);
  animation: chip-ripple .6s ease-out forwards;
  pointer-events: none;
}
@keyframes chip-ripple {
  from { width: 0; height: 0; opacity: 0.8; }
  to { width: 240px; height: 240px; opacity: 0; }
}

.used-filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 20px 16px 20px; }
.used-filters .used-chip { display: inline-flex; align-items: center; gap: 8px; background: #ffffff10; border: 1px solid #ffffff14; color: var(--text); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
.used-filters .used-chip .remove { width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer; background: #ffffff12; color: white; display: grid; place-items: center; }
.used-filters .used-chip .remove:hover { background: #ffffff18; }
.used-filters .used-chip .remove svg { width: 14px; height: 14px; fill: #cdd6ee; }

.content { max-width: 960px; margin: 32px auto; padding: 0 20px; color: #c5d0ea; }

@media (max-width: 900px) {
  .search-header__row { grid-template-columns: 1fr; row-gap: 12px; }
  .search-header__actions { justify-content: flex-end; }
}
    </style>
  </head>
  <body>
    <header class="search-header" role="search">
      <div class="search-header__row">
        <div class="search-header__brand">
          <span class="brand__dot"></span>
          <span class="brand__name">Findr</span>
        </div>

        <div class="search-header__bar">
          <div class="search-input" data-component="search-input">
            <svg class="search-input__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 14h-.79l-.28-.27a6.471 6.471 0 0 0 1.57-4.23 6.5 6.5 0 1 0-6.5 6.5 6.471 6.471 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10.5 14a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"></path>
            </svg>
            <input id="globalSearch" class="search-input__field" type="search" placeholder="Search products, brands, and more" autocomplete="off" />
            <button class="search-input__clear" type="button" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            <button id="submitSearch" class="btn btn--primary" type="button">Search</button>
          </div>
        </div>

        <div class="search-header__actions">
          <button class="icon-btn" type="button" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14,12.94a7.43,7.43,0,0,0,.05-.94,7.43,7.43,0,0,0-.05-.94l2.11-1.65a.5.5,0,0,0,.12-.64l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.28,7.28,0,0,0-1.63-.94l-.38-2.65A.5.5,0,0,0,12.75,2h-3.5a.5.5,0,0,0-.49.41L8.38,5.06a7.28,7.28,0,0,0-1.63.94l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.64L3.9,11.06a7.43,7.43,0,0,0-.05.94,7.43,7.43,0,0,0,.05.94L1.79,14.59a.5.5,0,0,0-.12.64l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.28,7.28,0,0,0,1.63.94l.38,2.65a.5.5,0,0,0,.49.41h3.5a.5.5,0,0,0,.49-.41l.38-2.65a7.28,7.28,0,0,0,1.63-.94l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.64ZM11,15a3,3,0,1,1,3-3A3,3,0,0,1,11,15Z"/></svg>
          </button>
        </div>
      </div>

      <div class="filters-row">
        <div class="filters-inline">
          <label class="select">
            <span class="select__label">Category</span>
            <select id="filterCategory">
              <option value="">Any</option>
              <option>Electronics</option>
              <option>Home</option>
              <option>Fashion</option>
              <option>Sports</option>
            </select>
          </label>

          <label class="select">
            <span class="select__label">Price</span>
            <select id="filterPrice">
              <option value="">Any</option>
              <option value="0-50">$0–$50</option>
              <option value="50-200">$50–$200</option>
              <option value="200+">$200+</option>
            </select>
          </label>

          <div class="chips">
            <button class="chip" type="button" data-filter="freeShipping" aria-pressed="false">
              <span class="chip__label">Free shipping</span>
            </button>
            <button class="chip" type="button" data-filter="inStock" aria-pressed="false">
              <span class="chip__label">In stock</span>
            </button>
            <button class="chip" type="button" data-filter="onSale" aria-pressed="false">
              <span class="chip__label">On sale</span>
            </button>
          </div>
        </div>

        <div class="filters-actions">
          <button id="btnReset" class="btn btn--ghost" type="button">Reset</button>
          <button id="btnApply" class="btn btn--primary" type="button">Apply filters</button>
        </div>
      </div>

      <div class="used-filters" aria-live="polite" aria-atomic="true"></div>
    </header>

    <main class="content">
      <p>Try the search bar, toggle some filters, and click Apply. Chips have fancy interactions including ripple and a soft glow when active.</p>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-3fpZf2x8GQxZ1E8u7G1Jr7dI+HgwlHGhEq+y3GkG4l0=" crossorigin="anonymous"></script>
    <script>
(function ($) {
  'use strict';

  function createRipple($target, event) {
    var offset = $target.offset();
    var x = event.pageX - offset.left;
    var y = event.pageY - offset.top;
    var $r = $('<span/>', { class: 'ripple' });
    $r.css({ left: x + 'px', top: y + 'px' });
    $target.append($r);
    setTimeout(function () { $r.remove(); }, 650);
  }

  function upsertUsedChip(key, label) {
    var $wrap = $('.used-filters');
    var safeKey = String(key);
    var chipId = 'used-' + safeKey;
    var $existing = $('#' + chipId);
    if ($existing.length) {
      $existing.find('.label').text(label);
      return $existing;
    }
    var $chip = $('<span/>', { id: chipId, class: 'used-chip', 'data-key': safeKey });
    var $label = $('<span/>', { class: 'label', text: label });
    var $remove = $('<button/>', { type: 'button', class: 'remove', 'aria-label': 'Remove ' + label });
    $remove.append('<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>');
    $chip.append($label, $remove);
    $wrap.append($chip);
    return $chip;
  }

  function removeUsedChip(key) {
    $('#used-' + key).remove();
  }

  function currentState() {
    return {
      query: $('#globalSearch').val().trim(),
      category: $('#filterCategory').val() || '',
      price: $('#filterPrice').val() || '',
      toggles: $('.chip[aria-pressed="true"]').map(function () { return $(this).data('filter'); }).get()
    };
  }

  function announceState() {
    var s = currentState();
    var msg = 'Searching for "' + (s.query || 'all') + '"'
      + (s.category ? (', in ' + s.category) : '')
      + (s.price ? (', price ' + s.price) : '')
      + (s.toggles.length ? (', filters: ' + s.toggles.join(', ')) : '');
    // For demo, log to console. In a real app, trigger the search request here.
    console.log('[Search]', msg);
  }

  $(function () {
    var $search = $('#globalSearch');
    var $clear = $('.search-input__clear');

    function updateClearVisibility() {
      var hasValue = $search.val().length > 0;
      $clear.prop('hidden', !hasValue);
    }

    $search.on('input', updateClearVisibility);
    updateClearVisibility();

    $clear.on('click', function () {
      $search.val('');
      updateClearVisibility();
      $search.trigger('focus');
    });

    $('#submitSearch').on('click', function () {
      announceState();
    });

    $search.on('keydown', function (e) {
      if (e.key === 'Enter') {
        announceState();
      }
    });

    $('.chip').on('click', function (e) {
      var $chip = $(this);
      createRipple($chip, e);
      var isActive = $chip.attr('aria-pressed') === 'true';
      $chip.attr('aria-pressed', String(!isActive));
      $chip.toggleClass('is-active', !isActive);
      var key = String($chip.data('filter'));
      var labelText = $chip.text().trim();
      if (!isActive) {
        upsertUsedChip('chip-' + key, labelText);
      } else {
        removeUsedChip('chip-' + key);
      }
      announceState();
    });

    $('#filterCategory').on('change', function () {
      var value = $(this).val();
      if (value) {
        upsertUsedChip('category', 'Category: ' + value);
      } else {
        removeUsedChip('category');
      }
      announceState();
    });

    $('#filterPrice').on('change', function () {
      var value = $(this).val();
      if (value) {
        var text = $('#filterPrice option:selected').text();
        upsertUsedChip('price', 'Price: ' + text);
      } else {
        removeUsedChip('price');
      }
      announceState();
    });

    $('.used-filters').on('click', '.remove', function () {
      var $chip = $(this).closest('.used-chip');
      var key = $chip.data('key');
      if (key === 'category') { $('#filterCategory').val(''); }
      if (key === 'price') { $('#filterPrice').val(''); }
      $chip.remove();
      announceState();
    });

    $('#btnReset').on('click', function () {
      $('#filterCategory').val('');
      $('#filterPrice').val('');
      $('.chip').attr('aria-pressed', 'false').removeClass('is-active');
      $('.used-filters').empty();
      $('#globalSearch').val('');
      updateClearVisibility();
      announceState();
    });

    $('#btnApply').on('click', function () {
      // In a real application, submit the form or trigger a fetch here.
      // We just log the state to demonstrate.
      announceState();
      // Provide a tiny visual feedback
      var $btn = $(this);
      $btn.addClass('is-bouncing');
      setTimeout(function(){ $btn.removeClass('is-bouncing'); }, 300);
    });
  });
})(jQuery);
    </script>
  </body>
  </html>
