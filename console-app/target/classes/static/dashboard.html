<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Console App - Dashboard</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      header { padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
      nav a { color: #93c5fd; text-decoration: none; margin-right: 16px; }
      nav a:hover { text-decoration: underline; }
      main { padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .card { background: #111827; border: 1px solid #374151; border-radius: 10px; padding: 20px; }
      .value { font-size: 32px; font-weight: 600; }
      .label { color: #94a3b8; }
    </style>
  </head>
  <body>
    <header>
      <div>Dashboard</div>
      <nav>
        <a href="/index.html">Home</a>
        <a href="/users.html">User Search</a>
      </nav>
    </header>
    <main>
      <div class="grid">
        <div class="card"><div class="label">Total Users</div><div id="totalUsers" class="value">-</div></div>
        <div class="card"><div class="label">Active Users</div><div id="activeUsers" class="value">-</div></div>
        <div class="card"><div class="label">Open Alerts</div><div id="openAlerts" class="value">-</div></div>
        <div class="card"><div class="label">System Health</div><div id="systemHealth" class="value">-</div></div>
      </div>
    </main>

    <script>
      $(function() {
        $.getJSON('/api/dashboard', function(data) {
          $('#totalUsers').text(data.totalUsers);
          $('#activeUsers').text(data.activeUsers);
          $('#openAlerts').text(data.openAlerts);
          $('#systemHealth').text(data.systemHealth);
        }).fail(function(xhr) {
          console.error('Failed to load dashboard', xhr.responseText);
        });
      });
    </script>
  </body>
  </html>
