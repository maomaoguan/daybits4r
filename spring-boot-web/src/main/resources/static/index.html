<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spring Controller Demo</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121933;
      --text: #e6e9f0;
      --muted: #a6adbb;
      --accent: #4f8cff;
      --accent-2: #62d0b6;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #0b1020 0%, #0d1530 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    main {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: radial-gradient(1200px 400px at 0% -10%, rgba(79,140,255,.15), transparent 55%),
                  radial-gradient(1200px 400px at 100% 110%, rgba(98,208,182,.15), transparent 55%),
                  var(--panel);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 16px 0;
      letter-spacing: .3px;
    }
    p { color: var(--muted); margin: 0 0 20px 0; }
    .row { display: flex; gap: 12px; }
    input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0e1531;
      color: var(--text);
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    input[type="text"]::placeholder { color: #8a93a5; }
    button {
      border: none;
      padding: 12px 16px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      background: linear-gradient(180deg, var(--accent), #3e6be0);
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    .status { margin-top: 14px; color: var(--muted); min-height: 20px; }
    pre {
      margin-top: 14px;
      background: #0d142e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Send a message to the Spring controller</h1>
      <p>Type text below and click Submit. The value is sent as a <code>text</code> query parameter to <code>/api/echo</code>.</p>
      <div class="row">
        <input id="textInput" type="text" placeholder="Type something..." />
        <button id="submitBtn" type="button">Submit</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <pre id="result" aria-live="polite"></pre>
    </div>
  </main>

  <script>
    const input = document.getElementById('textInput');
    const button = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    const statusEl = document.getElementById('status');

    function send() {
      const text = input.value.trim();
      if (!text) {
        result.textContent = 'Please enter some text.';
        return;
      }
      statusEl.textContent = 'Sending...';
      fetch('/api/echo?text=' + encodeURIComponent(text), {
        headers: { 'Accept': 'text/plain' }
      })
        .then(async (resp) => {
          const body = await resp.text();
          if (!resp.ok) throw new Error(body || 'Request failed');
          result.textContent = body;
        })
        .catch((err) => {
          result.textContent = 'Error: ' + err.message;
        })
        .finally(() => {
          statusEl.textContent = '';
        });
    }

    button.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
